
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190">
  <defs>
    <pattern id="cells" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="11" height="11" rx="2.5" fill="#161b22"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .cell {
        animation: pulse 2.8s ease-in-out infinite alternate;
      }
      .a { animation-delay: 0s; }
      .b { animation-delay: .5s; }
      .c { animation-delay: 1s; }
      .d { animation-delay: 1.5s; }
      .e { animation-delay: 2s; }
      @keyframes pulse {
        0%, 100% { opacity: .35; }
        50% { opacity: 1; }
      }
      .title {
        font: bold 18px Arial, sans-serif;
        fill: #e6edf3;
      }
      .muted {
        font: 12px Arial, sans-serif;
        fill: #8b949e;
      }
    </style>
  </defs>
  <rect width="900" height="190" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="30" class="title">GhousDeveloper</text>
  <circle cx="188" cy="24" r="4" fill="#39d353">
    <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="48" class="muted">Contribution activity · Keep building, keep growing</text>
